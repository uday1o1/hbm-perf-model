[project]
name = "hbmperf"
version = "0.1.0"
description = "HBM performance modeling and LLM inference workload analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "plotly>=5.20"]

[project.scripts]
hbmperf = "hbmperf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hbmperf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff.lint.per-file-ignores]
"src/hbmperf/catalog.py" = ["E741"]
